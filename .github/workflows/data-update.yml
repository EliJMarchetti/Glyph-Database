name: Scheduled glyph-data update

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - name: Install dependencies
        run: npm ci

      - name: Build glyph JSON
        env:
          GLYPH_SOURCE_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vSCEpYDEzWrpUaiujkZQhdMJUo5h_o8E_BCTeWPe0ZoNwcWvdtvoJ_qHsyh9stDmHkEE3U11MMvi4Ft/pub?output=xlsx
          SAVE_DOWNLOADED_SOURCE: 'true'
        run: npm run build:data

      - name: Commit & push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/sheet.xlsx data/glyphs.json
          if git diff --cached --quiet; then
            echo "No changes to glyph data"
            exit 0
          fi
          git commit -m "chore: auto-update glyph data [skip ci]"
          git push origin main

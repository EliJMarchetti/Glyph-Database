<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Prevent browser caching of the HTML/CSS/JS -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glyph Database</title>
  <!-- Bumped version to force CSS fetch -->
  <link rel="stylesheet" href="assets/css/style.css?v=8">
</head>
<body>
  <div id="bg-fallback"></div>
  <div id="app">
    <header>
      <input type="text" id="search" placeholder="Search glyphs..." />
      <label><input type="checkbox" id="searchTextToggle" /> Search in details</label>
      
      <!-- Tier dropdown + “up to” toggle -->
      <label class="tier-mode">
        <select id="levelFilter">
          <option value="all">All Glyphs</option>
        </select>
        <span>
          <input type="checkbox" id="tierUpTo" />
          <label for="tierUpTo">Up to</label>
        </span>
      </label>
      
      <div id="schoolFilters"></div>
    </header>

    <!-- MOBILE-ONLY TOGGLE BUTTON -->
    <button id="mobileHeaderToggle" class="header-toggle">▼</button>

    <main id="cardsContainer"></main>
  </div>

  <!-- Bumped version to force JS fetch -->
  <script src="assets/js/script.js?v=11"></script>
  <script>
    // Unregister any old service workers so they can’t cache your site
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs =>
        regs.forEach(r => r.unregister())
      );
    }
  </script>
</body>
</html>

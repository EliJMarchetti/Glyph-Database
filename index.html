<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Prevent browser caching of the HTML/CSS/JS -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glyph Database</title>
  <!-- Bump this when updating your CSS -->
  <link rel="stylesheet" href="assets/css/style.css?v=7">
</head>
<body>
  <!-- debug indicator -->
  <div id="debug" style="color: lime; padding: 0.5rem;"></div>

  <div id="bg-fallback"></div>
  <div id="app">
    <header>
      <input type="text" id="search" placeholder="Search glyphs..." />
      <label><input type="checkbox" id="searchTextToggle" /> Search in details</label>
      <select id="levelFilter">
        <option value="all">All Glyphs</option>
      </select>
      <div id="schoolFilters"></div>
    </header>

    <!-- mobile toggle -->
    <button id="mobileHeaderToggle" class="header-toggle">▼</button>

    <main id="cardsContainer"></main>
  </div>

  <!-- Bump this when updating your JS -->
  <script src="assets/js/script.js?v=9"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(regs => regs.forEach(r => r.unregister()));
    }
  </script>
</body>
</html>

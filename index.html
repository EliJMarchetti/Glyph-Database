<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Prevent any browser caching of the HTML -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glyph Database</title>
  <!-- Bumped version to force CSS fetch -->
  <link rel="stylesheet" href="assets/css/style.css?v=6">
</head>
<body>
  <div id="bg-fallback"></div>
  <div id="app">

    <!-- HEADER -->
    <header>
      <input type="text" id="search" placeholder="Search glyphs..." />
      <label><input type="checkbox" id="searchTextToggle" /> Search in details</label>
      <select id="levelFilter">
        <option value="all">All Glyphs</option>
      </select>
      <div id="schoolFilters"></div>
    </header>

    <!-- MOBILE-ONLY TOGGLE BUTTON (always visible) -->
    <button id="mobileHeaderToggle" class="header-toggle">▼</button>

    <!-- GLYPH CARDS -->
    <main id="cardsContainer"></main>
  </div>

  <!-- Bumped version to force JS fetch -->
  <script src="assets/js/script.js?v=8"></script>
  <!-- Unregister any old service workers so they can’t cache your site -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs =>
        regs.forEach(r => r.unregister())
      );
    }
  </script>
</body>
</html>

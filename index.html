<!DOCTYPE html>
<html lang="en">
<head>
  <!-- BUILD STAMP: 2026-03-10 19:10:00 -->
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glyph Database</title>
  <link rel="stylesheet" href="assets/css/style.css?v=202603101910">
</head>
<body>
  <div id="bg-fallback"></div>
  <div id="app">
    <header>
      <div id="pageOneHeader" class="page-panel active">
        <div class="controls-row">
          <input type="text" id="search" placeholder="Search glyphs..." />
          <label class="control-check" for="searchTextToggle">
            <input type="checkbox" id="searchTextToggle" />
            <span>Search in details</span>
          </label>
          <div class="tier-mode">
            <select id="levelFilter">
              <option value="all">All Glyphs</option>
            </select>
            <div class="tier-options">
              <label class="control-check" for="tierUpTo">
                <input type="checkbox" id="tierUpTo" />
                <span>Up to</span>
              </label>
              <label for="includeCantrips" id="includeCantripsLabel" class="control-check sub-toggle is-disabled">
                <input type="checkbox" id="includeCantrips" disabled />
                <span>Include Cantrips</span>
              </label>
            </div>
          </div>
        </div>
        <div id="schoolFilters"></div>
      </div>

      <div id="pageTwoHeader" class="page-panel page-panel-mana">
        <div class="mana-dashboard">
          <div
            id="manaReadoutButton"
            class="mana-readout-button"
            role="button"
            tabindex="0"
            aria-expanded="false"
            aria-label="Edit current and maximum mana"
          >
            <div id="manaReadout" class="mana-readout">7 / 7</div>
            <div id="manaMathEditor" class="mana-math-editor">
              <label class="mana-math-field" for="manaCurrentInput">
                <span>Current Mana</span>
                <input id="manaCurrentInput" type="number" min="0" step="1" inputmode="numeric" />
              </label>
              <label class="mana-math-field" for="manaMaxInput">
                <span>Max. Mana</span>
                <input id="manaMaxInput" type="number" min="1" step="1" inputmode="numeric" />
              </label>
              <div class="mana-math-actions">
                <button id="manaMathCancel" class="mana-mini-button" type="button">Cancel</button>
                <button id="manaMathSave" class="mana-mini-button" type="button">Apply</button>
              </div>
            </div>
          </div>

          <div
            id="manaBarShell"
            class="mana-bar-shell"
          >
            <div id="manaBarFill" class="mana-bar-fill"></div>
            <div class="mana-bar-label">Mana</div>
          </div>

          <div class="mana-control-stack">
            <button id="manaPotionButton" class="hold-button mana-potion-button" type="button">
              <span class="button-title">Mana Potion</span>
              <span class="button-subtitle">1d6+2</span>
            </button>

            <button id="longRestButton" class="hold-button long-rest-button" type="button">
              <span class="button-title">Long Rest</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <button
      id="mobileHeaderToggle"
      class="header-toggle"
      type="button"
      aria-expanded="false"
      aria-label="Toggle menu"
    >&#9662;</button>

    <main id="cardsContainer" aria-live="polite"></main>

    <footer class="page-nav" aria-label="Page navigation">
      <button id="pagePrev" class="page-arrow" type="button" aria-label="Previous page">&#8592;</button>
      <div class="page-nav-center">
        <div id="pageStatus" class="page-status">Page 1 of 2</div>
        <div id="pageDots" class="page-dots" aria-label="Page indicator"></div>
      </div>
      <button id="pageNext" class="page-arrow" type="button" aria-label="Next page">&#8594;</button>
    </footer>
  </div>

  <script src="assets/js/script.js?v=202603101910"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs =>
        regs.forEach(reg => reg.unregister())
      );
    }
  </script>
</body>
</html>

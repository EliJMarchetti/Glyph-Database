<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Prevent browser caching of HTML/CSS/JS -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glyph Database</title>
  <!-- Force CSS reload by bumping the version -->
  <link rel="stylesheet" href="assets/css/style.css?v=7">
</head>
<body>
  <div id="bg-fallback"></div>
  <div id="app">

    <!-- HEADER -->
    <header>
      <input type="text" id="search" placeholder="Search glyphs..." />
      <label><input type="checkbox" id="searchTextToggle" /> Search in details</label>
      <select id="levelFilter">
        <option value="all">All Glyphs</option>
      </select>
      <div id="schoolFilters"></div>
    </header>

    <!-- MOBILE-ONLY TOGGLE BUTTON -->
    <button id="mobileHeaderToggle" class="header-toggle">▼</button>

    <!-- GLYPH CARDS -->
    <main id="cardsContainer"></main>
  </div>

  <!-- Force JS reload by bumping the version -->
  <script src="assets/js/script.js?v=9"></script>

  <!-- Unregister any old service workers (so nothing is served from cache) -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(regs => regs.forEach(r => r.unregister()));
    }
  </script>
</body>
</html>

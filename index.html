<!DOCTYPE html>
<html lang="en">
<head>
  <!-- BUILD STAMP: 2026-03-16 14:05:00 -->
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glyph Database</title>
  <link rel="stylesheet" href="assets/css/style.css?v=202603161405">
</head>
<body>
  <div id="bg-fallback" style="background-image: url('assets/bg.jpg');"></div>
  <div id="app">
    <header>
      <div id="pageOneHeader" class="page-panel active">
        <div class="controls-row">
          <input type="text" id="search" placeholder="Search glyphs..." />
          <label class="control-check" for="searchTextToggle">
            <input type="checkbox" id="searchTextToggle" />
            <span>Search in details</span>
          </label>
          <div class="tier-mode">
            <select id="levelFilter">
              <option value="all">All Glyphs</option>
            </select>
            <div class="tier-options">
              <label class="control-check" for="tierUpTo">
                <input type="checkbox" id="tierUpTo" />
                <span>Up to</span>
              </label>
              <label for="includeCantrips" id="includeCantripsLabel" class="control-check sub-toggle is-disabled">
                <input type="checkbox" id="includeCantrips" disabled />
                <span>Include Cantrips</span>
              </label>
            </div>
          </div>
        </div>
        <div id="schoolFilters"></div>
      </div>

      <div id="pageTwoHeader" class="page-panel page-panel-mana">
        <div class="mana-dashboard">
          <div
            id="manaReadoutButton"
            class="mana-bar-shell resource-bar-button"
            role="button"
            tabindex="0"
            aria-expanded="false"
            aria-label="Edit current and maximum mana"
          >
            <div id="manaBarFill" class="mana-bar-fill"></div>
            <div id="manaReadout" class="resource-bar-readout">Mana 7/7</div>
            <div id="manaMathEditor" class="mana-math-editor resource-math-editor">
              <label class="mana-math-field" for="manaCurrentInput">
                <span>Current Mana</span>
                <input id="manaCurrentInput" type="number" min="0" step="1" inputmode="numeric" />
              </label>
              <label class="mana-math-field" for="manaMaxInput">
                <span>Max. Mana</span>
                <input id="manaMaxInput" type="number" min="1" step="1" inputmode="numeric" />
              </label>
              <div class="mana-math-actions">
                <button id="manaMathCancel" class="mana-mini-button" type="button">Cancel</button>
                <button id="manaMathSave" class="mana-mini-button" type="button">Apply</button>
              </div>
            </div>
          </div>

          <div class="mana-control-stack">
            <button id="manaPotionButton" class="hold-button mana-potion-button" type="button">
              <span class="button-title">Mana Potion</span>
              <span class="button-subtitle">1d6+2</span>
            </button>

            <button id="longRestButton" class="hold-button long-rest-button" type="button">
              <span class="button-title">Long Rest</span>
              <span id="manaLongRestTallies" class="long-rest-tallies"></span>
            </button>
          </div>
        </div>
      </div>

      <div id="pageThreeHeader" class="page-panel page-panel-hp">
        <div class="hp-dashboard">
          <div
            id="hpReadoutButton"
            class="hp-bar-shell resource-bar-button"
            role="button"
            tabindex="0"
            aria-expanded="false"
            aria-label="Edit current and maximum hitpoints"
          >
            <div id="hpBarFill" class="hp-bar-fill"></div>
            <div id="hpTempOverlay" class="hp-temp-overlay" hidden></div>
            <div id="hpConditionSparkles" class="hp-condition-sparkles" hidden></div>
            <div id="hpMortalityMarks" class="hp-mortality-marks"></div>
            <div id="hpReadout" class="resource-bar-readout">Hitpoints 12/12</div>
            <div id="hpMathEditor" class="mana-math-editor resource-math-editor">
              <label class="mana-math-field" for="hpCurrentInput">
                <span>Current HP</span>
                <input id="hpCurrentInput" type="number" min="0" step="1" inputmode="numeric" />
              </label>
              <label class="mana-math-field" for="hpMaxInput">
                <span>Max. HP</span>
                <input id="hpMaxInput" type="number" min="1" step="1" inputmode="numeric" />
              </label>
              <div class="mana-math-actions">
                <button id="hpMathCancel" class="mana-mini-button" type="button">Cancel</button>
                <button id="hpMathSave" class="mana-mini-button" type="button">Apply</button>
              </div>
            </div>
          </div>

          <div class="hp-control-grid">
            <button id="healthPotionButton" class="hold-button hp-action-button" type="button">
              <span class="button-title">Health Potion</span>
              <span class="button-subtitle">2-5 HP</span>
            </button>

            <div class="short-rest-control">
              <button id="shortRestButton" class="hold-button hp-action-button" type="button">
                <span class="button-title">Short Rest</span>
                <span id="shortRestSummary" class="button-subtitle">D8 + CON</span>
              </button>
              <select id="shortRestDieSelect" class="short-rest-select">
                <option value="d4">d4</option>
                <option value="d6">d6</option>
                <option value="d8">d8</option>
                <option value="d10">d10</option>
                <option value="d12">d12</option>
              </select>
            </div>

            <button id="hpLongRestButton" class="hold-button long-rest-button hp-action-button" type="button">
              <span class="button-title">Long Rest</span>
              <span id="hpLongRestTallies" class="long-rest-tallies"></span>
            </button>

            <div class="hp-adjust-stack">
              <div class="hp-adjuster">
                <button id="hpAdjustMinusButton" class="hold-button hp-adjust-button" type="button">-</button>
                <input id="hpAdjustValue" class="hp-adjust-value" type="number" min="0" step="1" inputmode="numeric" value="1" />
                <button id="hpAdjustPlusButton" class="hold-button hp-adjust-button" type="button">+</button>
              </div>
              <button id="tempHpButton" class="mana-mini-button temp-hp-button" type="button">
                Temp HP: <span id="tempHpValue">0</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <button
      id="mobileHeaderToggle"
      class="header-toggle"
      type="button"
      aria-expanded="false"
      aria-label="Toggle menu"
    >&#9662;</button>

    <main id="cardsContainer" aria-live="polite"></main>

    <footer class="page-nav" aria-label="Page navigation">
      <button id="pagePrev" class="page-arrow" type="button" aria-label="Previous page">&#8592;</button>
      <div class="page-nav-center">
        <div id="pageStatus" class="page-status">Page 1 of 3</div>
        <div id="pageDots" class="page-dots" aria-label="Page indicator"></div>
      </div>
      <button id="pageNext" class="page-arrow" type="button" aria-label="Next page">&#8594;</button>
    </footer>
  </div>

  <div id="sheetModal" class="sheet-modal" hidden>
    <div class="sheet-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="sheetModalTitle">
      <div class="sheet-modal-header">
        <h2 id="sheetModalTitle" class="sheet-modal-title">Edit</h2>
        <button id="sheetModalClose" class="sheet-modal-close" type="button" aria-label="Close popup">&times;</button>
      </div>
      <div id="sheetModalBody" class="sheet-modal-body"></div>
      <div id="sheetModalActions" class="sheet-modal-actions"></div>
    </div>
  </div>

  <script src="assets/js/script.js?v=202603161405"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs =>
        regs.forEach(reg => reg.unregister())
      );
    }
  </script>
</body>
</html>

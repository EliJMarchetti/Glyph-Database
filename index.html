<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glyph Database</title>
  <link rel="stylesheet" href="assets/css/style.css?v=6">
</head>
<body>
  <!-- fallback background -->
  <div id="bg-fallback"></div>

  <div id="app">
    <header>
      <input type="text" id="search" placeholder="Search glyphs…" />
      <label><input type="checkbox" id="searchTextToggle" /> Search in details</label>
      <select id="levelFilter">
        <option value="all">All Glyphs</option>
      </select>

      <!-- Admin Mode toggles -->
      <button id="enterAdmin" class="school-button">🔒 Admin</button>
      <button id="saveAdmin" class="school-button" style="display:none">💾 Save Changes</button>

      <div id="schoolFilters"></div>
    </header>

    <!-- mobile-only dropdown toggle -->
    <button id="mobileHeaderToggle" class="header-toggle">▼</button>

    <main id="cardsContainer"></main>
  </div>

  <!-- 1) Octokit via ES module (must come before your script) -->
  <script type="module">
    import { Octokit } from 'https://cdn.skypack.dev/@octokit/rest';
    window.Octokit = Octokit;
  </script>
  <!-- 2) Your app script -->
  <script src="assets/js/script.js?v=6"></script>
</body>
</html>

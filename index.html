<!DOCTYPE html>
<div class="controls-row"></div>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Prevent browser caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glyph Database</title>
  <link rel="stylesheet" href="assets/css/style.css?v=9">
</head>
<body>
  <div id="bg-fallback"></div>
  <div id="app">
    <header>
      <!-- Row 1: search + tier controls -->
      <div class="controls-row">
        <input type="text" id="search" placeholder="Search glyphs…" />
        <label>
          <input type="checkbox" id="searchTextToggle" /> Search in details
        </label>
        <div class="tier-mode">
          <select id="levelFilter">
            <option value="all">All Glyphs</option>
          </select>
          <label for="tierUpTo">
            <input type="checkbox" id="tierUpTo" /> Up to
          </label>
        </div>
      </div>
      <!-- Row 2: school buttons -->
      <div id="schoolFilters"></div>
    </header>

    <!-- Mobile: show/hide header -->
    <button id="mobileHeaderToggle" class="header-toggle">▼</button>

    <!-- Glyph cards -->
    <main id="cardsContainer"></main>
  </div>

  <script src="assets/js/script.js?v=12"></script>
  <script>
    // unregister old service‐workers so they don’t cache
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs =>
        regs.forEach(r => r.unregister())
      );
    }
  </script>
</body>
</html>

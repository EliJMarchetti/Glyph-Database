<!DOCTYPE html>
<html lang="en">
<head>
  <!-- BUILD STAMP: 2025-11-08 16:18:30 -->
  <meta charset="UTF-8" />
  <!-- Prevent browser caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glyph Database</title>
  <link rel="stylesheet" href="assets/css/style.css?v=545978060">
</head>
<body>
  <div id="bg-fallback"></div>
  <div id="app">
    <header>
      <div class="controls-row">
        <input type="text" id="search" placeholder="Search glyphs..." />
        <label>
          <input type="checkbox" id="searchTextToggle" /> Search in details
        </label>
        <div class="tier-mode">
          <select id="levelFilter">
            <option value="all">All Glyphs</option>
          </select>
          <div class="tier-options">
            <label for="tierUpTo">
              <input type="checkbox" id="tierUpTo" /> Up to
            </label>
            <label for="includeCantrips" id="includeCantripsLabel" class="sub-toggle is-disabled">
              <input type="checkbox" id="includeCantrips" disabled /> Include Cantrips
            </label>
          </div>
        </div>
      </div>
      <div id="schoolFilters"></div>
    </header>

    <button
      id="mobileHeaderToggle"
      class="header-toggle"
      type="button"
      aria-expanded="false"
      aria-label="Toggle filters"
    >&#9662;</button>

    <main id="cardsContainer"></main>
  </div>

  <script src="assets/js/script.js?v=1472385743"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs =>
        regs.forEach(reg => reg.unregister())
      );
    }
  </script>
</body>
</html>
